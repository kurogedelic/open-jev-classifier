<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Jev Classifier</title><style>*{box-sizing:border-box}body{margin:0;color:#111;font:16px/1.4 Inter,Helvetica,Arial,sans-serif}main{width:min(560px,calc(100% - 40px));margin:18vh auto}h1{font-size:18px;font-weight:500;margin:0 0 36px}label{display:block;font-size:12px;margin:18px 0 6px}input{width:100%;border:0;border-bottom:1px solid #111;padding:10px 0;font:inherit;outline:none}button{margin-top:30px;border:1px solid #111;background:#fff;padding:10px 18px;font:inherit;cursor:pointer}#result{margin-top:36px;font-size:42px;letter-spacing:-2px;min-height:60px}#meta,#error{font-size:11px;margin-top:8px;color:#666}</style></head><body><main><h1>Open Jev Classifier</h1><label>A</label><input id="a" placeholder="Tesla coil"><label>B</label><input id="b" placeholder="musical instrument"><button id="ask">A is B?</button><div id="result"></div><div id="meta"></div><div id="error"></div></main><script>const $=id=>document.getElementById(id);$("ask").onclick=async()=>{const a=$("a").value.trim(),b=$("b").value.trim();if(!a||!b)return;$("result").textContent="…";$("meta").textContent="";$("error").textContent="";try{const r=await fetch("/api/classify",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({a,b})});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");$("result").textContent=Math.round(j.probability*100)+"%";$("meta").textContent=j.model||""}catch(e){$("result").textContent="";$("error").textContent=e.message}};</script></body></html>
